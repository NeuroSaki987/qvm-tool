[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qvmtool"
version = "0.1.0"
description = "Detection and symbol recovery for ACE QVM/TVM virtualised PE images"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pefile>=2023.2.7",
    "capstone>=5.0",
]

[project.optional-dependencies]
emu = ["unicorn>=2.0"]
dev = ["pytest>=7"]

[project.scripts]
qvmtool = "qvmtool.cli:main"

[tool.setuptools]
packages = ["qvmtool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
